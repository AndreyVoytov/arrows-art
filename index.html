<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arrows Art</title>
    <link rel="stylesheet" href="styles.css?v=20260523-layer">
  </head>
  <body>
    <main class="game-shell" id="game-shell" aria-label="Игра с ремонтом комнат">
      <div class="game" id="game">
        <img class="ui-bg" src="images/ui/bg.png" alt="">
        <img class="room-bg" id="room-bg" alt="">
        <div class="layer" id="items"></div>
        <div class="layer actions" id="actions"></div>

        <div class="level-test hidden" id="level-test" aria-label="Тест уровня">
          <button class="level-step" id="level-down" type="button" aria-label="Предыдущий уровень">‹</button>
          <span class="level-value">Уровень <strong id="level-value">0</strong></span>
          <button class="level-step" id="level-up" type="button" aria-label="Следующий уровень">›</button>
        </div>

        <button class="top-menu-button" id="top-menu-button" type="button">Меню</button>

        <section class="dialog-overlay hidden" id="dialog-overlay" aria-label="Диалог">
          <img class="dialog-character dialog-character-left hidden" id="dialog-character-left" alt="">
          <img class="dialog-character dialog-character-right hidden" id="dialog-character-right" alt="">
          <div class="dialog-box">
            <div class="dialog-speaker" id="dialog-speaker"></div>
            <p class="dialog-text" id="dialog-text"></p>
            <button class="dialog-next" id="dialog-next" type="button">Далее</button>
          </div>
        </section>

        <section class="room-menu" id="room-menu" aria-label="Меню">
          <div class="room-menu-panel">
            <div class="menu-heading">
              <h1 id="menu-title">Выбор комнаты</h1>
              <div class="menu-tabs" aria-label="Разделы меню">
                <button class="menu-tab selected" id="rooms-tab" type="button">Комнаты</button>
              </div>
            </div>

            <section class="menu-view" id="rooms-view">
              <div class="room-list" id="room-list"></div>
            </section>

            <section class="menu-view dialog-editor-view hidden" id="dialog-editor-view" aria-label="Редактор диалогов">
              <div class="editor-toolbar">
                <label class="editor-field room-index-field">
                  <span>Room index</span>
                  <input id="editor-room-index" type="number" min="1" step="1" value="1">
                </label>
                <button class="editor-icon-button" id="dialog-add" type="button" aria-label="Создать диалог">+</button>
                <button class="editor-command" id="dialog-export" type="button">Экспорт</button>
              </div>

              <div class="dialog-editor-grid">
                <div class="dialog-list" id="dialog-list" aria-label="Существующие диалоги"></div>

                <form class="dialog-form hidden" id="dialog-form">
                  <div class="dialog-form-row">
                    <label class="editor-field">
                      <span>Dialog id</span>
                      <input id="dialog-id" type="text" autocomplete="off">
                    </label>
                    <label class="editor-field compact">
                      <span>Room index</span>
                      <input id="dialog-room-index" type="number" min="1" step="1">
                    </label>
                  </div>

                  <div class="editor-section">
                    <div class="editor-section-title">
                      <span>Условия</span>
                      <button class="editor-icon-button small" id="condition-add" type="button" aria-label="Добавить условие">+</button>
                    </div>
                    <div class="editor-stack" id="condition-list"></div>
                  </div>

                  <div class="editor-section">
                    <div class="editor-section-title">
                      <span>Реплики</span>
                      <button class="editor-icon-button small" id="line-add" type="button" aria-label="Добавить реплику">+</button>
                    </div>
                    <div class="editor-stack" id="line-list"></div>
                  </div>

                  <div class="dialog-form-actions">
                    <button class="editor-command primary" id="dialog-save" type="submit">Сохранить</button>
                    <button class="editor-command danger" id="dialog-delete" type="button">Удалить</button>
                  </div>
                </form>
              </div>

              <textarea class="dialog-export-output hidden" id="dialog-export-output" readonly aria-label="Экспортированный dialogs.json"></textarea>
            </section>
          </div>
        </section>

        <section class="variant-panel hidden" id="variant-panel" aria-label="Выбор варианта">
          <button class="variant-command variant-choose" id="variant-choose" type="button">Выбрать</button>
          <div class="variant-options" id="variant-options"></div>
          <button class="variant-command variant-close" id="variant-close" type="button">Закрыть</button>
        </section>
        <div class="sr-only" id="status" aria-live="polite"></div>
      </div>
    </main>
    <script src="game.js?v=20260523-layering"></script>
  </body>
</html>
